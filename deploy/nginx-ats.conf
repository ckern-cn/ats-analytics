# ATS: nginx front end for ats.ckern.cn.
#
# Install as /etc/nginx/apps/ats.ckern.cn.conf and symlink it from
# /etc/nginx/apps.enabled/ats.ckern.cn.conf. The backend binds loopback only.
#
# The certificate is expected at /etc/nginx/ssl/ckern.cn/ (wildcard
# *.ckern.cn). Change the two paths if you use a different layout.

upstream ats_capi {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ats.ckern.cn;
    return 301 https://$host$request_uri;
}


# Unmatched TLS hosts must not fall through to the first server block. The
# wildcard certificate is only presented so the handshake completes; the
# connection is then closed without a response.
server {
    listen       443 ssl default_server;
    listen       [::]:443 ssl default_server;
    server_name  _;

    ssl_certificate     "/etc/nginx/ssl/ckern.cn/cert.pem";
    ssl_certificate_key "/etc/nginx/ssl/ckern.cn/key.pem";

    return 444;
}

# The apex belongs to the user, not to ATS. Send it to the canonical host.
server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    server_name  ckern.cn www.ckern.cn;

    ssl_certificate     "/etc/nginx/ssl/ckern.cn/cert.pem";
    ssl_certificate_key "/etc/nginx/ssl/ckern.cn/key.pem";

    return 301 https://ats.ckern.cn$request_uri;
}

server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  ats.ckern.cn;

    root /webapps/ats-c/public;

    ssl_certificate     "/etc/nginx/ssl/ckern.cn/cert.pem";
    ssl_certificate_key "/etc/nginx/ssl/ckern.cn/key.pem";
    ssl_session_cache   shared:ATS_SSL:10m;
    ssl_session_timeout 10m;
    ssl_ciphers         PROFILE=SYSTEM;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/ats.ckern.cn.access.log;
    error_log  /var/log/nginx/ats.ckern.cn.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    # Static assets are served by nginx, never by the app.
    location ^~ /res/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
    }

    # Loopback-only liveness probe (used by monitoring).
    location = /__health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://ats_capi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Tracking scripts, admin UI and everything else.
    #
    # Cross-origin tracking must not receive X-Frame-Options, COEP or
    # Cross-Origin-Resource-Policy: customer sites embed /rv.js, /wru and /pv.
    location / {
        proxy_pass http://ats_capi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
