single_binary=yes
kore_source=vendor/kore-4.2.3
kore_flavor=TLS_BACKEND=none NOTLS=1

cflags=-std=c99 -Wall -Wextra -Werror -D_GNU_SOURCE
cflags=-Isrc/vendor

ldflags=-lm -lsqlite3 -lmaxminddb -lpcre2-8

dev {
	cflags=-g -O0
}

prod {
	cflags=-O2
}

asan {
	cflags=-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer
	ldflags=-fsanitize=address,undefined
}
