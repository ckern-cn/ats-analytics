# ats-capi: ATS backend. Bind loopback and put a TLS reverse proxy in front.
#
# TLS/HTTP2/static assets/client IP injection are nginx's job. This server
# binds loopback only and speaks plain HTTP. Path and method matching is done
# in src/router.c so the tracking endpoints keep their exact URLs.

pidfile			$ATS_CAPI_PID

http_body_max		1048576
http_body_disk_offload	524288
http_body_disk_path	$ATS_CAPI_BODY_TMP
http_body_timeout	30000

http_server_version	ats-capi

workers			2

server ats {
	bind		127.0.0.1 3001
	tls		no
}

domain * {
	attach		ats

	route .* {
		handler		ats_dispatch
	}
}
